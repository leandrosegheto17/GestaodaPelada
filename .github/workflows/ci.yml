name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/preparar-node
      - run: pnpm lint
      - run: node backend/scripts/checagens/checar-migracao-aditiva.mjs
      - run: node backend/scripts/checagens/checar-grupo-id.mjs
      - run: node backend/scripts/checagens/checar-escrita-e-dono.mjs
      - run: pnpm --filter @pelada/contrato checar-compatibilidade
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm test:checagens
      - run: node backend/scripts/checagens/checar-ids-tarefa.mjs
      - run: node backend/scripts/checagens/checar-urls-absolutas.mjs
      - run: node backend/scripts/checagens/checar-wrangler-deploy.mjs
      - run: pnpm -r build
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    needs: base
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DATABASE_URL_TESTE: postgres://postgres:postgres@localhost:5432/pelada_teste
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-node
      - run: pnpm --filter @pelada/api test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-node
      - run: pnpm --filter @pelada/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pelada/web build
      - run: pnpm --filter @pelada/web e2e
      - run: pnpm --filter @pelada/web visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual
          path: frontend/web/e2e/resultado/
          if-no-files-found: ignore

  e2e-integracao:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-node
      - run: pnpm --filter @pelada/web exec playwright install --with-deps chromium
      - run: docker compose up -d --build --wait
      - run: pnpm --filter @pelada/web e2e:integracao
      - name: Logs do compose
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integracao-falha
          path: |
            compose.log
            frontend/web/test-results/
          if-no-files-found: ignore
      - run: docker compose down -v
        if: always()
