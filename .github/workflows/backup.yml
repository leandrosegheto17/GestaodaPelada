name: backup

on:
  schedule:
    - cron: '0 7 * * *' # 04:00 em São Paulo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Data do backup (São Paulo)
        id: data
        run: echo "dia=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dump-cifrado
        with:
          url: ${{ secrets.NEON_URL_BACKUP_LEITURA }}
          chave: ${{ secrets.BACKUP_CHAVE }}
          nome-artefato: backup-${{ steps.data.outputs.dia }}-${{ github.run_id }}
