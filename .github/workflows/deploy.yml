name: deploy

# Único lugar com `wrangler deploy` (conferido por backend/scripts/checagens/checar-wrangler-deploy.mjs).
# Só produção (ADR-020, sem homologação). Disparo manual (`/deploy` ou Actions → Run workflow), sempre pela main; o push não dispara deploy.
# O build do web vem primeiro: uma configuração inválida falha antes de qualquer mudança em produção.
# Ordem: branch de restauração no Neon -> dump cifrado -> migração -> cache do Hyperdrive -> deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      AMBIENTE: producao
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node

      - name: Build do web (antes de tocar no banco)
        run: pnpm --filter @pelada/web build

      - name: Branch de restauração no Neon
        id: restauracao
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pai="production"
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches"
          cabecalho="Authorization: Bearer ${NEON_API_KEY}"
          id_pai="$(curl -fsS -H "$cabecalho" "$api" | pnpm --silent exec tsx backend/scripts/ops/restauracao-neon-cli.ts pai "$pai" --executar)"
          nome="restauracao-${AMBIENTE}-${RUN_ID}"
          curl -fsS -X POST -H "$cabecalho" -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"${nome}\",\"parent_id\":\"${id_pai}\"}}" "$api" >/dev/null
          echo "nome=${nome}" >> "$GITHUB_OUTPUT"
          # Mantém só os 2 branches de restauração mais novos (limite do plano gratuito).
          curl -fsS -H "$cabecalho" "$api" | pnpm --silent exec tsx backend/scripts/ops/restauracao-neon-cli.ts antigos "$AMBIENTE" --executar |
            while read -r antigo; do curl -fsS -X DELETE -H "$cabecalho" "${api}/${antigo}" >/dev/null; done

      - name: Dump cifrado antes da migração
        uses: ./.github/actions/dump-cifrado
        with:
          url: ${{ secrets.NEON_URL_MIGRACAO_PROD }}
          chave: ${{ secrets.BACKUP_CHAVE }}
          nome-artefato: dump-predeploy-${{ env.AMBIENTE }}-${{ github.run_id }}

      - name: Migrar o banco
        id: migrar
        env:
          CI: 'true'
          DATABASE_URL: ${{ secrets.NEON_URL_MIGRACAO_PROD }}
        run: pnpm exec tsx backend/scripts/migrar.ts --alvo "$AMBIENTE"

      - name: Conferir o cache do Hyperdrive desligado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_BASE: ${{ vars.CLOUDFLARE_API_BASE }}
        run: |
          set -euo pipefail
          id="$(pnpm --silent exec tsx backend/scripts/ops/hyperdrive-id.ts)"
          # A regra do G-17 fica no script testado; o token é validado e vai por stdin do curl.
          bash backend/scripts/ops/consultar-hyperdrive.sh "$id" |
            pnpm --silent exec tsx backend/scripts/ops/verificar-cache-hyperdrive-cli.ts --executar

      - name: Deploy
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: pnpm --filter @pelada/api exec wrangler deploy -c ../../wrangler.jsonc --var "URL_PUBLICA:${URL_PUBLICA}"

      - name: Conferir a saúde do app
        env:
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: curl -fsS --retry 3 "${URL_PUBLICA}/api/saude"

      - name: Desfazer o deploy e instruir a restauração
        if: failure() && steps.migrar.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESTAURACAO: ${{ steps.restauracao.outputs.nome }}
          RESULTADO_DEPLOY: ${{ steps.publicar.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULTADO_DEPLOY" = "success" ]; then
            pnpm --filter @pelada/api exec wrangler rollback -c ../../wrangler.jsonc --message "Falha depois do deploy (run ${RUN_ID})" || true
          fi
          echo "A migração já foi aplicada. Para restaurar o banco, use o branch '${RESTAURACAO}' do Neon ou o artefato dump-predeploy-${AMBIENTE}-${RUN_ID}. Passo a passo: backend/DEPLOY.md."
