# Ambiente local descartável: banco, API (wrangler dev) e web (Vite com proxy de /api).
# Senhas abaixo são fictícias e valem só para esta máquina.
x-node: &node
  image: node:22
  working_dir: /app
  volumes:
    - .:/app
    - node_modules_raiz:/app/node_modules
    - node_modules_contrato:/app/backend/contrato/node_modules
    - node_modules_dominio:/app/backend/dominio/node_modules
    - node_modules_api:/app/backend/api/node_modules
    - node_modules_web:/app/frontend/web/node_modules
    - pnpm_store:/root/.local/share/pnpm

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pelada
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *node
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pelada
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@db:5432/pelada
    ports:
      - '127.0.0.1:8787:8787'
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm migrar &&
      pnpm seed &&
      pnpm --filter @pelada/api exec wrangler dev -c ../../wrangler.jsonc --ip 0.0.0.0 --port 8787 --var URL_PUBLICA:http://localhost:5173 --var DONO_EMAIL:$$(pnpm --silent exec tsx -e \"import { EMAIL_DONO } from './backend/scripts/seed-local/ids'; process.stdout.write(EMAIL_DONO)\")"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 180

  frontend:
    <<: *node
    depends_on:
      backend:
        condition: service_started
    environment:
      ALVO_API_DEV: http://backend:8787
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:5173:5173'
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @pelada/web dev --host 0.0.0.0 --port 5173 --strictPort"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 180

volumes:
  dados_db:
  node_modules_raiz:
  node_modules_contrato:
  node_modules_dominio:
  node_modules_api:
  node_modules_web:
  pnpm_store:
