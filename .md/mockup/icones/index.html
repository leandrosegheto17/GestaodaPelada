<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ícone do app: proposta</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../fontes/fontes.css">
<style>
body{margin:0;background:var(--cor-fundo);color:var(--cor-texto);font-family:var(--fonte-texto);padding:24px 16px}
h1{font-family:var(--fonte-titulo);text-transform:uppercase}
.linha{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.caixa{padding:16px;border-radius:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.claro{background:var(--cor-fundo);outline:1px solid var(--cor-texto-sec)}
.escuro{background:var(--cor-texto);color:var(--cor-sobre-verde)}
.circulo img{clip-path:circle(40%)}
figure{margin:0;text-align:center;font-size:14px}
</style>
</head>
<body>
<h1>Ícone do app: proposta</h1>
<p>Derivado da direção A (faixas de gramado e bola amarela). Aguarda aprovação do usuário.</p>
<div class="linha">
  <div class="caixa claro"><figure><img src="icone.svg" width="128" height="128" alt="Ícone em SVG"><figcaption>SVG, fundo claro</figcaption></figure>
  <figure><img src="icone-192.png" width="96" height="96" alt="Ícone 192"><figcaption>192</figcaption></figure>
  <figure><img src="icone-512.png" width="128" height="128" alt="Ícone 512"><figcaption>512</figcaption></figure>
  <figure><img src="apple-touch-180.png" width="90" height="90" alt="Apple touch 180"><figcaption>Apple 180</figcaption></figure></div>
  <div class="caixa escuro"><figure><img src="icone-512.png" width="128" height="128" alt="Ícone em fundo escuro"><figcaption>Fundo escuro</figcaption></figure></div>
  <div class="caixa claro circulo"><figure><img src="icone-512-maskable.png" width="128" height="128" alt="Ícone com máscara circular"><figcaption>Máscara circular (área segura 80%)</figcaption></figure></div>
</div>
</body>
</html>
