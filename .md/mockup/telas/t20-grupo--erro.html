<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dados do grupo (corrigir)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- Recorte no formulário. -->
<header class="barra barra--admin"><div class="barra__grupo"><span class="barra__nome">Pelada de Quinta</span><a class="barra__link" href="t08-grupos--sucesso.html">Trocar grupo</a></div></header>
<main class="conteudo conteudo--admin conteudo--estreito">
  <h1 class="titulo-pagina">Dados do grupo</h1>
  <form class="formulario" novalidate>
    <div class="campo campo--erro"><label class="campo__rotulo" for="nome">Nome</label><input class="campo__entrada" id="nome" value="Pe" maxlength="60" aria-invalid="true" aria-describedby="nome-ajuda nome-erro"><p class="campo__ajuda" id="nome-ajuda">Mudar o nome não muda o link do ranking.</p><p class="campo__erro" id="nome-erro" role="alert">O nome precisa ter de 3 a 60 caracteres.</p></div>
    <div class="duas-colunas">
      <div class="campo"><label class="campo__rotulo" for="dia">Dia da semana</label><select class="campo__entrada" id="dia"><option selected>Quinta</option></select></div>
      <div class="campo"><label class="campo__rotulo" for="hora">Horário</label><input class="campo__entrada" id="hora" type="time" value="20:00"></div>
    </div>
    <div><button class="botao botao--principal" type="submit">Salvar</button></div>
  </form>
</main>
</body>
</html>
