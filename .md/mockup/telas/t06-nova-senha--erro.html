<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crie sua senha (erro)</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<header class="barra"><p class="barra__titulo">Gestão da Pelada</p></header>
<main class="conteudo conteudo--estreito">
  <h1 class="titulo-pagina">Crie sua senha</h1>
  <p class="paragrafo">Por segurança, crie sua senha antes de continuar.</p>
  <form class="formulario" novalidate>
    <div class="faixa faixa--erro resumo-erros" role="alert"><div class="faixa__texto"><strong>Corrija 2 campos:</strong><ul><li><a href="#nova">Nova senha</a></li><li><a href="#conf">Confirmar nova senha</a></li></ul></div></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="nova">Nova senha</label><input class="campo__entrada" id="nova" type="password" autocomplete="new-password" aria-invalid="true" aria-describedby="nova-ajuda nova-erro" value="••••••••••••"><p class="campo__ajuda" id="nova-ajuda">De 8 a 72 caracteres.</p><p class="campo__erro" id="nova-erro">A nova senha precisa ser diferente da temporária.</p></div>
    <div class="campo campo--erro"><label class="campo__rotulo" for="conf">Confirmar nova senha</label><input class="campo__entrada" id="conf" type="password" autocomplete="new-password" aria-invalid="true" aria-describedby="conf-erro" value="•••••••••"><p class="campo__erro" id="conf-erro">As senhas não conferem.</p></div>
    <button class="botao botao--principal botao--bloco" type="submit">Salvar e continuar</button>
    <button class="botao botao--texto" type="button">Sair</button>
  </form>
</main>
</body>
</html>
